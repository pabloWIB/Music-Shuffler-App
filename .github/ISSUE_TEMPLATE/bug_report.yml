name: Bug report · Reportar un error
description: Something does not work as it should · Algo no funciona como debería
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened? · ¿Qué pasó?
      description: What you did and what you expected instead · Qué hiciste y qué esperabas
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce · Pasos para repetirlo
      placeholder: |
        1. Add 20 songs from a folder
        2. Press Mezclar
        3. ...
  - type: input
    id: browser
    attributes:
      label: Browser and device · Navegador y equipo
      placeholder: Chrome 130 on Windows 11, Safari on iPhone…
